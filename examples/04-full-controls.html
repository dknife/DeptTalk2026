<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실습 4 · 제어 UI 완성</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Inter Tight','Noto Sans KR',system-ui,-apple-system,sans-serif; background: #EDEDED; }
    #panel {
      position: absolute; left: 12px; bottom: 12px;
      background: #FFFFFF; color: #222; border: 1px solid #e5e5e5; padding: 14px 16px;
      border-radius: 12px; font-size: 13px; width: 260px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06), 0 2px 6px rgba(0,0,0,0.04);
    }
    #panel h3 { margin: 0 0 10px; font-size: 14px; color: #111; }
    .row { margin: 8px 0; }
    .clips button, .fmt button {
      margin: 2px 4px 2px 0; padding: 5px 10px; border: 0; border-radius: 6px;
      background: #EDEDED; color: #222; cursor: pointer; font-size: 12px;
    }
    .clips button.active, .fmt button.active { background: #FA5D29; color: #fff; }
    label { display: block; margin-bottom: 3px; color: #555; }
    input[type=range] { width: 100%; accent-color: #FA5D29; }
    #playBtn { width: 100%; padding: 8px; border: 0; border-radius: 8px; cursor: pointer;
      background: #FA5D29; color: #fff; font-size: 13px; font-weight: bold; }
    #playBtn:hover { background: #e24d1c; }
    #status { position: absolute; top: 10px; left: 12px; color: #222;
      background: #FFFFFF; border: 1px solid #e5e5e5; padding: 6px 10px; border-radius: 12px; font-size: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06), 0 2px 6px rgba(0,0,0,0.04); }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="status">로딩 중…</div>

  <div id="panel">
    <h3>애니메이션 제어</h3>
    <div class="row fmt">
      <label>포맷</label>
      <button id="fmtFbx" class="active">FBX</button>
      <button id="fmtGlb">GLB</button>
    </div>
    <div class="row clips" id="clips"><!-- 애니메이션 버튼이 동적으로 채워짐 --></div>
    <div class="row">
      <button id="playBtn">⏸ 일시정지</button>
    </div>
    <div class="row">
      <label>재생 속도 <span id="speedVal">1.0×</span></label>
      <input type="range" id="speed" min="0" max="2" step="0.05" value="1" />
    </div>
    <div class="row">
      <label>타임라인</label>
      <input type="range" id="timeline" min="0" max="1" step="0.001" value="0" />
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const status = document.getElementById('status');

    // ── 소스 정의: FBX(원본) vs GLB(변환본) ──
    // 같은 캐릭터·동작을 두 포맷으로 두고 버튼으로 전환한다.
    const SOURCES = {
      fbx: { dir: '../fbx/', ext: '.fbx' },
      glb: { dir: '../glb/', ext: '.glb' },
    };
    const CHARACTER = 'character';
    const ANIMATIONS = [
      { name: '걷기', file: 'walk_ani' },
      // { name: '뛰기', file: 'run' },   // 두 포맷 모두 준비되어 있으면 추가
    ];

    // ── 기본 씬 ──
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xEDEDED);
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 120, 320);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));
    const dirLight = new THREE.DirectionalLight(0xffffff, 2);
    dirLight.position.set(100, 200, 100);
    scene.add(dirLight);
    scene.add(new THREE.GridHelper(400, 20, 0xcccccc, 0xe0e0e0));
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 100, 0);
    controls.enableDamping = true;

    const clock = new THREE.Clock();
    let character = null;     // 현재 캐릭터 오브젝트
    let mixer = null;         // 현재 캐릭터의 재생기
    const actions = [];       // 각 애니메이션의 AnimationAction
    let current = null;       // 현재 재생 중인 action
    let isPlaying = true;

    // ── 포맷별 로더 ──
    const fbxLoader = new FBXLoader();
    const gltfLoader = new GLTFLoader();

    // ─────────────────────────────────────────────
    // 핵심: 포맷에 따라 다른 로더를 쓰되, 결과를 같은 형태로 반환한다.
    //   FBX  → FBXLoader.load  → Group(그 안에 .animations)
    //   GLB  → GLTFLoader.load → gltf.scene(오브젝트) + gltf.animations(클립 배열)
    //   반환: { object, animations }  ← 이후 코드는 포맷을 몰라도 된다.
    // ─────────────────────────────────────────────
    function loadModel(kind, url) {
      return new Promise((resolve, reject) => {
        if (kind === 'glb') {
          gltfLoader.load(url,
            (gltf) => resolve({ object: gltf.scene, animations: gltf.animations || [] }),
            undefined, reject);
        } else {
          fbxLoader.load(url,
            (obj) => resolve({ object: obj, animations: obj.animations || [] }),
            undefined, reject);
        }
      });
    }

    // GLB는 변환 시 미터 단위로 축소되는 경우가 많다(원본 FBX는 대략 170단위).
    // 두 포맷이 같은 크기로 보이도록 키(height)를 기준으로 스케일을 정규화한다.
    function normalizeScale(obj) {
      const h = new THREE.Box3().setFromObject(obj).getSize(new THREE.Vector3()).y || 1;
      obj.scale.setScalar(170 / h);
    }

    // ── 소스(포맷) 불러오기 / 전환 ──
    async function loadSource(kind) {
      status.textContent = `${kind.toUpperCase()} 불러오는 중…`;

      // 이전 캐릭터 정리
      if (character) {
        scene.remove(character);
        character.traverse((o) => {
          if (o.geometry) o.geometry.dispose();
          if (o.material) [].concat(o.material).forEach((m) => m.dispose());
        });
      }
      mixer = null; actions.length = 0; current = null;
      clipsEl.innerHTML = '';

      try {
        const src = SOURCES[kind];

        // 캐릭터
        const charRes = await loadModel(kind, src.dir + CHARACTER + src.ext);
        character = charRes.object;
        scene.add(character);
        normalizeScale(character);
        mixer = new THREE.AnimationMixer(character);

        // 애니메이션들
        for (const entry of ANIMATIONS) {
          const animRes = await loadModel(kind, src.dir + entry.file + src.ext);
          const clip = animRes.animations[0];
          if (!clip) continue;
          clip.name = entry.name;
          actions.push(mixer.clipAction(clip));
        }

        setupUI();
        status.textContent = `준비 완료 ✓ (${kind.toUpperCase()})`;
      } catch (e) {
        console.error(e);
        status.textContent = `⚠ ${kind.toUpperCase()} 로드 실패 — ${SOURCES[kind].dir} 경로 확인`;
      }
    }

    // ─────────────────────────────────────────────
    // 제어 UI
    // ─────────────────────────────────────────────
    const clipsEl = document.getElementById('clips');
    const playBtn = document.getElementById('playBtn');
    const speedEl = document.getElementById('speed');
    const speedVal = document.getElementById('speedVal');
    const timelineEl = document.getElementById('timeline');

    // 애니메이션 전환 버튼 생성
    function setupUI() {
      clipsEl.innerHTML = '';
      actions.forEach((action, i) => {
        const btn = document.createElement('button');
        btn.textContent = action.getClip().name;
        btn.onclick = () => switchTo(i);
        clipsEl.appendChild(btn);
      });
      if (actions.length) switchTo(0); // 첫 애니메이션 재생
    }

    // 애니메이션 전환 — 부드럽게 크로스페이드(0.4초)
    function switchTo(index) {
      const next = actions[index];
      if (!next || next === current) return;

      next.reset();
      next.setEffectiveTimeScale(parseFloat(speedEl.value));
      next.play();

      if (current) current.crossFadeTo(next, 0.4, false);
      current = next;

      [...clipsEl.children].forEach((b, i) => b.classList.toggle('active', i === index));
    }

    // ── 포맷 전환 버튼 ──
    const fmtFbxBtn = document.getElementById('fmtFbx');
    const fmtGlbBtn = document.getElementById('fmtGlb');
    function setFormat(kind) {
      fmtFbxBtn.classList.toggle('active', kind === 'fbx');
      fmtGlbBtn.classList.toggle('active', kind === 'glb');
      loadSource(kind);
    }
    fmtFbxBtn.onclick = () => setFormat('fbx');
    fmtGlbBtn.onclick = () => setFormat('glb');

    // 재생 / 일시정지
    playBtn.onclick = () => {
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? '⏸ 일시정지' : '▶ 재생';
    };

    // 재생 속도
    speedEl.oninput = () => {
      const v = parseFloat(speedEl.value);
      speedVal.textContent = v.toFixed(2) + '×';
      if (current) current.setEffectiveTimeScale(v);
    };

    // 타임라인 스크럽 — 드래그하면 해당 시점으로 이동
    let scrubbing = false;
    timelineEl.addEventListener('pointerdown', () => (scrubbing = true));
    timelineEl.addEventListener('pointerup', () => (scrubbing = false));
    timelineEl.oninput = () => {
      if (current) current.time = parseFloat(timelineEl.value) * current.getClip().duration;
    };

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer && isPlaying && !scrubbing) mixer.update(delta);

      if (current && !scrubbing) {
        const dur = current.getClip().duration || 1;
        timelineEl.value = (current.time % dur) / dur;
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── 시작: 기본은 FBX ──
    loadSource('fbx');
  </script>
</body>
</html>
