<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실습 1 · 3D 기본 씬</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #info {
      position: absolute; top: 10px; left: 10px; color: #fff;
      background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 6px;
      font-size: 13px; line-height: 1.5;
    }
  </style>

  <!-- [핵심] importmap: 'three'라는 이름을 실제 CDN 주소로 연결해 준다.
       이렇게 하면 아래 스크립트에서 import 'three' 처럼 짧게 쓸 수 있다. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="info">실습 1 · 3D 기본 씬<br />마우스 드래그: 회전 / 휠: 확대·축소</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ─────────────────────────────────────────────
    // 3D 화면을 그리려면 최소 3가지가 필요하다.
    //  1) Scene   : 물체들이 놓이는 '무대'
    //  2) Camera  : 무대를 바라보는 '눈'
    //  3) Renderer: 눈에 보인 것을 화면(canvas)에 '그리는 붓'
    // ─────────────────────────────────────────────

    // 1) 무대
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2b2b33);

    // 2) 눈 (원근 카메라: 시야각 45도, 화면비율, 가까운/먼 렌더 거리)
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 4);

    // 3) 붓
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // 조명: 물체가 보이려면 빛이 있어야 한다.
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2)); // 하늘/바닥 색 은은한 빛
    const dirLight = new THREE.DirectionalLight(0xffffff, 2);     // 태양 같은 방향광
    dirLight.position.set(3, 10, 5);
    scene.add(dirLight);

    // 바닥(그리드)과 물체(정육면체) — 나중에 이 자리에 캐릭터가 들어온다.
    scene.add(new THREE.GridHelper(10, 10, 0x888888, 0x444444));
    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0x4f9dde })
    );
    cube.position.y = 0.5;
    scene.add(cube);

    // OrbitControls: 마우스로 카메라를 궤도 회전시키는 컨트롤
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.enableDamping = true; // 관성(부드럽게 멈춤)

    // 렌더 루프: 매 프레임(초당 약 60회) 화면을 다시 그린다.
    function animate() {
      requestAnimationFrame(animate);
      cube.rotation.y += 0.01; // 큐브를 조금씩 회전
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // 창 크기가 바뀌면 카메라 비율과 렌더 크기를 다시 맞춘다.
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
